<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist — Pawan Mode</title>
  <meta name="description" content="Gear you've saved on Pawan Mode.">
  <meta name="theme-color" content="#07070c">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <noscript><style>.curtain { display: none; }</style></noscript>
</head>
<body data-page="wishlist">
  <div class="curtain is-closed" id="curtain" aria-hidden="true"><div class="curtain-spinner"><span class="spin"></span>Loading</div></div>

  <main id="main">
    <section class="page-hero">
      <div class="world" data-world data-seed="45" data-cars="4"></div>
      <div class="container page-hero-inner">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Wishlist</span></nav>
        <h1>Your <span style="color:var(--pink)">wishlist</span></h1>
        <p class="lead" id="wishLead">Gear you've marked for later.</p>
      </div>
    </section>

    <section class="section" style="padding-top:32px">
      <div class="container">
        <div class="section-head" id="wishHead" hidden>
          <p class="result-count" id="wishCountText" style="margin:0"></p>
          <button class="btn btn-primary btn-sm" id="moveAll">Move all to cart</button>
        </div>
        <div class="grid" id="wishGrid"></div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="section-head">
          <div><span class="eyebrow">Trending in the city</span><h2 class="section-title">Worth <span>saving</span></h2></div>
        </div>
        <div class="grid" id="wishSuggest"></div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/products-live.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/wishlist.js"></script>
</body>
</html>
