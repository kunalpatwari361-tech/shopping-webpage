<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — Pawan Mode</title>
  <meta name="description" content="Your Pawan Mode cart.">
  <meta name="theme-color" content="#07070c">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <noscript><style>.curtain { display: none; }</style></noscript>
</head>
<body data-page="cart">
  <div class="curtain is-closed" id="curtain" aria-hidden="true"><div class="curtain-spinner"><span class="spin"></span>Loading</div></div>

  <main id="main">
    <section class="page-hero">
      <div class="world" data-world data-seed="33" data-heli="0" data-cars="6"></div>
      <div class="container page-hero-inner">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Cart</span></nav>
        <h1>Your <span style="color:var(--gold)">loot</span></h1>
        <p class="lead" id="cartLead">Check your gear before the getaway.</p>
      </div>
    </section>

    <section class="section" style="padding-top:32px">
      <div class="container">
        <div class="cart-layout" id="cartLayout">
          <div class="cart-list" id="cartList"></div>
          <aside class="summary" id="summary" aria-label="Order summary"></aside>
        </div>
      </div>
    </section>

    <section class="section" id="suggestSection" style="padding-top:0">
      <div class="container">
        <div class="section-head">
          <div><span class="eyebrow">Complete the loadout</span><h2 class="section-title">You might <span>also like</span></h2></div>
        </div>
        <div class="grid" id="suggest"></div>
      </div>
    </section>

    <section class="section" id="orders" style="padding-top:0">
      <div class="container">
        <div class="section-head">
          <div><span class="eyebrow">Mission log</span><h2 class="section-title">Your <span>orders</span></h2></div>
        </div>
        <div class="orders" id="orderList"></div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/cart.js"></script>
</body>
</html>
